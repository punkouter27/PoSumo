# Kim REAL 01 - created 2026-11-10. The "realism" pass: all ten options of the
# 2026-11-10 list that need a training run, staged as ONE curriculum.
# DOCS/20261110/real01.md lists what each change touches and why.
#
# WHAT CHANGES FOR THE POLICY
#  * INPUT +2 (53 -> 55): balance observations - centre of mass and capture point
#    relative to the middle of the feet. Appended LAST. The character sheet stays
#    OFF (the shipped 53-input brain needs it off); env_args below forces it on in
#    the env, and DeployBrain sets the sheet flag when the 55-input brain ships.
#  * REWARD: slip_penalty / walk_slip_penalty (a LOADED foot sliding) and
#    jerk2_penalty / walk_jerk2_penalty (second difference of the command). Both 0
#    on every sheet; set here. CALIBRATE after the first summaries: compare
#    Realism/FootSlip against these coefficients (shaping trap 1 in AGENTS.md).
#  * DOMAIN: obs_delay_max (0-1 decisions of sensor delay), mass_jitter +/-5% per
#    part, damping_jitter +/-20% per joint. Training only.
#  * WALK LANE: stand_assist (an upward pelvis force, fraction of body weight,
#    scheduled DOWN to 0) and walk_obstacle_height (low bales across the lane that
#    a dragged foot cannot pass). Training only; the game never sets either.
#
# CURRICULUM, one schedule on training PROGRESS so the stages move together:
#    0.00-0.25 BALANCE      assist 0.5, flat lane, no delay, no shoves
#    0.25-0.50 LOCOMOTION   assist 0.25
#    0.50-0.70 PERTURBATION assist 0, 1-decision delay, sumo shoves 15 N s
#    0.70-1.00 OBSTACLES    3 cm then 6 cm bales
# Progress, not reward: one behavior name carries both walk and sumo agents, so
# its mean reward mixes two schools and cannot say when either is ready.
#
# WARM START: widen the shipped 53-input brain by two zero-weighted columns,
#   Training/venv/Scripts/python.exe Tools/onnx_warmstart.py Assets/Agents/Kim_v01/Kim.onnx \
#       Training/results/kim_realinit/Kim/checkpoint.pt --new-obs 2
# then preflight with --widened. Judge the fight on ELO SHAPE from 1200, the walk
# on Gate/WalkFailures and Realism/*. Export only after
#   Tools/graduation_gate.py Training/results/kim_real01 --behavior Kim
# passes (DeployBrain refuses otherwise).
#
# Launch (Editor CLOSED, AGENTS.md rule 4):
#   pwsh -File Training/Start-StaminaExtension.ps1 -Fighters Kim -Phase Real01 -InitializeFromPhase Realinit -NumEnvs 2 -Minutes 0

env_settings:
  env_args: [-posumoBalanceObs]

behaviors:
  Kim:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.997
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 250000
    max_steps: 6000000
    time_horizon: 1000
    summary_freq: 30000
    threaded: false
    self_play:
      window: 25
      play_against_latest_model_ratio: 0.25
      save_steps: 50000
      swap_steps: 50000
      team_change: 250000

environment_parameters:
  # --- always on -------------------------------------------------------------
  get_up_chance: 0.3
  slip_penalty: 0.002
  walk_slip_penalty: 0.002
  jerk2_penalty: 0.0003
  walk_jerk2_penalty: 0.0003
  mass_jitter: 0.05
  damping_jitter: 0.2
  walk_obstacle_count: 2

  # --- staged ------------------------------------------------------------------
  stand_assist:
    curriculum:
      - name: balance
        completion_criteria: {measure: progress, behavior: Kim, min_lesson_length: 100, threshold: 0.25}
        value: 0.5
      - name: locomotion
        completion_criteria: {measure: progress, behavior: Kim, min_lesson_length: 100, threshold: 0.5}
        value: 0.25
      - name: unaided
        value: 0.0

  obs_delay_max:
    curriculum:
      - name: crisp
        completion_criteria: {measure: progress, behavior: Kim, min_lesson_length: 100, threshold: 0.5}
        value: 0
      - name: delayed
        value: 1

  shove_impulse:
    curriculum:
      - name: calm
        completion_criteria: {measure: progress, behavior: Kim, min_lesson_length: 100, threshold: 0.5}
        value: 0
      - name: shoved
        value: 15

  walk_obstacle_height:
    curriculum:
      - name: flat
        completion_criteria: {measure: progress, behavior: Kim, min_lesson_length: 100, threshold: 0.7}
        value: 0.0
      - name: low
        completion_criteria: {measure: progress, behavior: Kim, min_lesson_length: 100, threshold: 0.85}
        value: 0.03
      - name: bales
        value: 0.06

  platform_difficulty:
    curriculum:
      - name: wide
        completion_criteria: {measure: progress, behavior: Kim, min_lesson_length: 100, threshold: 0.3}
        value: 0.0
      - name: mixed
        completion_criteria: {measure: progress, behavior: Kim, min_lesson_length: 100, threshold: 0.6}
        value: 0.5
      - name: full
        value: 1.0
