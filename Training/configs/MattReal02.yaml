# Matt REAL 02 - created 2026-11-18. A 60-minute-budget follow-up to Real01.
# Why: matt_real01 (6M steps) lifted ELO 1220 -> 1670 but failed the walk gate:
# Gate/WalkFailures 23% -> 60% when stand_assist hit 0, recovering to 44%, then
# 81% once the 6 cm bales arrived. The 2026-11-10 notes call slip/jerk2 "guesses until
# calibrated"; Realism/FootSlip stayed ~0.23 for the whole run.
# Changes vs Real01: short run (1.2M), assist fades at 30% progress, bales capped at
# 3 cm, full platform from the start. Matt warm-starts from matt_real01 (55 obs);
# Grandma/Nick/Kim from <name>_realinit (shipped 53-obs brain widened +2 by
# Tools/onnx_warmstart.py --new-obs 2).
# Judge: ELO shape (fight), Gate/WalkFailures (walk); deploy only past graduation_gate.
# Outcome: DOCS/20261118/real02.md.

env_settings:
  env_args: [-posumoBalanceObs]

behaviors:
  Matt:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 1.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.997
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 200000
    max_steps: 1200000
    time_horizon: 1000
    summary_freq: 30000
    threaded: false
    self_play:
      window: 25
      play_against_latest_model_ratio: 0.25
      save_steps: 50000
      swap_steps: 50000
      team_change: 250000

environment_parameters:
  # --- always on (penalties live from step 0; in Real01 their lessons never left 0) --
  get_up_chance: 0.3
  slip_penalty: 0.002
  walk_slip_penalty: 0.002
  jerk2_penalty: 0.0003
  walk_jerk2_penalty: 0.0003
  mass_jitter: 0.05
  damping_jitter: 0.2
  walk_obstacle_count: 2
  platform_difficulty: 1.0

  # --- short staged fade (progress of a 1.2M run) ---------------------------------
  stand_assist:
    curriculum:
      - name: last_aid
        completion_criteria: {measure: progress, behavior: Matt, min_lesson_length: 50, threshold: 0.3}
        value: 0.25
      - name: unaided
        value: 0.0

  obs_delay_max:
    curriculum:
      - name: crisp
        completion_criteria: {measure: progress, behavior: Matt, min_lesson_length: 50, threshold: 0.3}
        value: 0
      - name: delayed
        value: 1

  shove_impulse:
    curriculum:
      - name: calm
        completion_criteria: {measure: progress, behavior: Matt, min_lesson_length: 50, threshold: 0.3}
        value: 0
      - name: shoved
        value: 15

  # 3 cm bales only; Real01's 6 cm stage is where walk failures went 44% -> 81%.
  walk_obstacle_height:
    curriculum:
      - name: flat
        completion_criteria: {measure: progress, behavior: Matt, min_lesson_length: 50, threshold: 0.5}
        value: 0.0
      - name: low
        value: 0.03
