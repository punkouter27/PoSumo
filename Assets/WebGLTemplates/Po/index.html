<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f17">
    <link rel="icon" href="data:,">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* PoSumo's page. The chrome (name, fullscreen, /diag gear, version) is drawn
         ONCE, here, outside the canvas: a 44px top bar and a 20px footer. The canvas
         fills everything between them at any aspect - landscape or portrait - and
         the game's UI Toolkit panel scales to it (GamePanelSettings, Expand mode). */
      :root { --bg: #0b0f17; --surface: #121826; --text: #e6e9f2; --muted: #9aa3b5; --accent: #6366f1; --line: #232c3f; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
                   font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { display: flex; flex-direction: column; height: 100dvh; }
      #po-bar { flex: 0 0 44px; display: flex; align-items: center; justify-content: space-between;
                padding: 0 8px 0 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
      #po-bar a.po-brand { color: var(--text); text-decoration: none; font-weight: 600; font-size: 15px; letter-spacing: 0.02em; }
      #po-bar .po-actions { display: flex; gap: 6px; }
      #po-bar .po-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 8px;
                        border: 1px solid var(--line); background: var(--bg); color: var(--text); text-decoration: none;
                        font: 18px/1 system-ui, sans-serif; cursor: pointer; padding: 0; }
      #po-bar .po-btn:hover, #po-bar .po-btn:focus-visible { border-color: var(--accent); outline: none; }
      #frame { position: relative; flex: 1 1 auto; min-height: 0; }
      #unity-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg);
                      outline: none; touch-action: none; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
                 justify-content: center; gap: 14px; font-weight: 600; font-size: 14px; letter-spacing: 0.12em; }
      #bar { width: min(60%, 360px); height: 6px; border-radius: 3px; background: var(--surface); overflow: hidden; }
      #fill { width: 0; height: 100%; background: var(--accent); }
      #error { position: absolute; left: 8%; right: 8%; bottom: 8%; display: none; padding: 12px; border-radius: 6px;
               background: #5a1a1a; color: #fff; font-size: 13px; line-height: 1.4; }
      #po-foot { flex: 0 0 20px; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px;
                 font-size: 11px; color: var(--muted); background: var(--bg); }
    </style>
  </head>
  <body>
    <header id="po-bar">
      <a class="po-brand" href="/">{{{ PRODUCT_NAME }}}</a>
      <div class="po-actions">
        <button class="po-btn" id="po-full" type="button" aria-label="Fullscreen" title="Fullscreen">&#x26F6;</button>
        <a class="po-btn" href="/diag" aria-label="Settings and system status" title="System status (/diag)">&#x2699;</a>
      </div>
    </header>
    <div id="frame">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading"><div>{{{ PRODUCT_NAME }}}</div><div id="bar"><div id="fill"></div></div></div>
      <div id="error"></div>
    </div>
    <footer id="po-foot"><span class="po-version">v{{{ PRODUCT_VERSION }}}</span></footer>
    <script>
      var canvas = document.getElementById("unity-canvas");
      var loading = document.getElementById("loading");
      var fill = document.getElementById("fill");
      var errorBox = document.getElementById("error");

      // Tab toggles the in-game diagnostics overlay. Keep the browser from also
      // moving focus off the canvas (default action only; the game still sees it).
      window.addEventListener("keydown", function (e) {
        if (e.key === "Tab") e.preventDefault();
      });

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
      }

      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Sharp on high-DPI screens without paying for 3x phones.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (message, type) {
          if (type === "error") showError(message);
        },
      };

      var instance = null;
      document.getElementById("po-full").addEventListener("click", function () {
        var frame = document.getElementById("frame");
        if (document.fullscreenElement) document.exitFullscreen();
        else if (frame.requestFullscreen) frame.requestFullscreen();
        else if (instance) instance.SetFullscreen(1);
        canvas.focus();
      });

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          instance = unityInstance;
          loading.style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          showError(String(message));
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
