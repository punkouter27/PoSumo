[project]
name = "posumo"
version = "0.1.0"
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]

# The repo's own Python is scripts/ and tests/. Training/ml-agents is vendored third-party
# code (a pinned, locally patched ML-Agents 4.1.0) and is linted by its upstream, not here.
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "Library",
    "Packages",
    "Builds",
    "Logs",
    "Temp",
    "UserSettings",
    "Training/ml-agents",
    "Training/venv",
    "Training/results",
    "scripts/publish-venv",
    ".claude",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501", # long lines: the formatter owns wrapping; long string literals stay readable
    "UP031", # printf-style formatting is used deliberately in the report tables
]

[tool.ruff.format]
quote-style = "double"
